# Renderiza un Reel (voz oficial "csf" + vídeo) en un runner de GitHub (16 GB de RAM).
# La sesión de la tarea diaria no tiene memoria suficiente para Qwen3-TTS 1.7B en float32.
# No cambia la voz ni su código: ejecuta generator/reel.py tal cual sobre el spec indicado.
# Además: descarga las fotos/sonidos del spec (tools/assets.py), instala GSAP e iconos (npm ci) y deja un informe
# de escucha del resultado (earshot) en posts/<slug>/escucha.txt.
name: Render Reel

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug del Reel (generator/specs/<slug>.json)"
        required: true
      cache_from:
        description: "Opcional: slug de un Reel anterior cuya voz por escena se reutiliza (versiones nuevas del mismo guion)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render-reel-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_XET: "1"
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar spec
        run: |
          case "$SLUG" in *[!a-z0-9_-]*|"") echo "Slug no válido"; exit 1;; esac
          test -f "generator/specs/$SLUG.json"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Herramientas de vídeo (GSAP, iconos Lucide y Simple Icons)
        run: npm ci --no-audit --no-fund

      - name: Paquetes del sistema (ffmpeg, Inter, sox)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter sox

      - name: Dependencias de Python (versiones fijadas, torch de CPU)
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q -r generator/requirements-reel.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium

      - name: Caché del modelo de voz (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-tts-1.7b-base-v1

      - name: Caché de la voz por escena
        uses: actions/cache@v4
        with:
          path: generator/.voice_cache
          key: voice-${{ inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            voice-${{ inputs.slug }}-
            voice-${{ inputs.cache_from || inputs.slug }}-

      - name: Fotos y sonidos del spec (Unsplash, Wikimedia Commons, Openverse)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: |
          # entorno aparte para no tocar las versiones de la voz (requirements-reel.txt)
          python -m venv /tmp/assets
          /tmp/assets/bin/pip install -q "opencv-contrib-python-headless==4.14.0.*" "rembg[cpu]==2.0.*" pillow numpy
          /tmp/assets/bin/python tools/assets.py resolver "generator/specs/$SLUG.json"

      - name: Renderizar
        run: python generator/reel.py "generator/specs/$SLUG.json"

      - name: Caché de los modelos de escucha (earshot)
        uses: actions/cache@v4
        with:
          path: ~/.cache/earshot
          key: earshot-listen-v1

      - name: Escuchar el resultado con earshot (informe, no bloquea)
        continue-on-error: true
        run: |
          python -m venv /tmp/ears
          /tmp/ears/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/ears/bin/pip install -q "earshot[listen] @ git+https://github.com/Leonxlnx/earshot@7a7f7c5c70d4a763a1eca4b3666af7c77e313f97"
          {
            echo "# Escucha de posts/$SLUG/reel.mp4 (earshot)"
            /tmp/ears/bin/earshot timeline "posts/$SLUG/reel.mp4" 2>&1
            echo
            /tmp/ears/bin/earshot describe "posts/$SLUG/reel.mp4" 2>&1
          } > "posts/$SLUG/escucha.txt"
          cat "posts/$SLUG/escucha.txt"

      - name: Subir el vídeo como artefacto (copia de seguridad)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: |
            posts/${{ inputs.slug }}/reel.mp4
            posts/${{ inputs.slug }}/cover.jpg

      - name: Commit y push a main
        run: |
          git config user.name "csf-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "posts/$SLUG/reel.mp4" "posts/$SLUG/cover.jpg"
          for f in "posts/$SLUG/assets" "posts/$SLUG/sfx_cues.json" "posts/$SLUG/escucha.txt"; do [ -e "$f" ] && git add "$f"; done
          git commit -m "Reel $SLUG renderizado en GitHub Actions"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
